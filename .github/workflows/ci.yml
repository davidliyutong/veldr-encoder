name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            dist/ffmpeg/src
            dist/ffmpeg/build-${{ matrix.platform }}
          key: encoder-${{ matrix.platform }}-${{ hashFiles('build.sh') }}
      - run: ./build.sh
        env:
          FFMPEG_PLATFORMS: linux/${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: veldr-encoder-${{ matrix.platform }}
          path: dist/release/veldr-encoder-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
